<script>

const waffleler = [

];


const icecekler = [

{id:"icecek1",isim:"Coca-Cola",fiyat:75},

{id:"icecek2",isim:"Fanta",fiyat:75},

{id:"icecek3",isim:"Sprite",fiyat:75},

{id:"icecek4",isim:"Lipton Şeftali",fiyat:75},

{id:"icecek5",isim:"Lipton Limon",fiyat:75},

{id:"icecek6",isim:"Fuse Tea Mango",fiyat:75},

{id:"icecek7",isim:"Nescafe Xpress",fiyat:100},

{id:"icecek8",isim:"Red Bull",fiyat:100},

{id:"icecek9",isim:"Bardak Limonata",fiyat:40},

{id:"icecek10",isim:"Limonlu Soda",fiyat:50},

{id:"icecek11",isim:"Sade Soda",fiyat:40},

{id:"icecek12",isim:"Su",fiyat:20}

];


const meyveler = [

"Muz",
"Çilek",
"Kivi",
"Orman Meyvesi"

];


const soslar = [

"Antep Sosu",
"Lotus Sosu",
"Sütlü Çikolata",
"Beyaz Çikolata",
"Bitter Çikolata",
"Karamel",
"Frambuaz",
"Çilek Sosu"

];


const suslemeler = [

"Oreo Parçacıkları",
"Lotus Parçacıkları",
"Fındık Parçacıkları",
"Renkli Bonibon",
"Renkli Pirinç Patlağı",
"Sütlü Damla Çikolata",
"Bitter Damla Çikolata",
"Çakıl Taşı Çikolata"

];


const ekstraFiyat = 30;


/*
Her eklenen waffle ayrı bir sipariş nesnesidir.

Örnek:

Standart Waffle #1
Lotus Waffle #2
Standart Waffle #3

Böylece aynı waffle iki kere alınsa bile
her biri farklı numaraya sahip olur.
*/

let waffleSiparisleri = [];

let icecekAdetleri = {};

let seciliWaffle = "";

let globalWaffleNo = 0;


/* KATEGORİ */

function kategoriAc(button){

const category = button.parentElement;

category.classList.toggle("open");

}


/* WAFFLE EKLE */

function waffleDegistir(id,degisiklik){

if(degisiklik > 0){

const waffle =
waffleler.find(w => w.id === id);

globalWaffleNo++;

const yeniWaffle = {

siparisId:
"siparis_" + globalWaffleNo,

no:
globalWaffleNo,

id:
waffle.id,

isim:
waffle.isim,

fiyat:
waffle.fiyat,

extralar:{}

};

waffleSiparisleri.push(yeniWaffle);


/*
Yeni eklenen waffle otomatik olarak
ekstra hedefi olur.
*/

seciliWaffle =
yeniWaffle.siparisId;

}

else{

const index =
waffleSiparisleri
.map(w => w.id)
.lastIndexOf(id);

if(index !== -1){

const silinen =
waffleSiparisleri[index];

if(seciliWaffle === silinen.siparisId){

seciliWaffle = "";

}

waffleSiparisleri.splice(index,1);

}

}

urunleriGoster();

sepetiGoster();

}


/* WAFFLE HEDEFİ */

function waffleHedefSec(siparisId){

seciliWaffle = siparisId;

urunleriGoster();

}


/* İÇECEK */

function icecekDegistir(id,degisiklik){

if(!icecekAdetleri[id]){

icecekAdetleri[id] = 0;

}

icecekAdetleri[id] += degisiklik;

if(icecekAdetleri[id] < 0){

icecekAdetleri[id] = 0;

}

urunleriGoster();

sepetiGoster();

}


/* EKSTRA */

function ekstraDegistir(tur,isim,degisiklik){

if(!seciliWaffle){

alert("Önce waffle çeşitlerinden bir waffle için 🎯 Ekstra Ekle butonuna bas.");

return;

}

const waffle =
waffleSiparisleri.find(
w => w.siparisId === seciliWaffle
);

if(!waffle){

alert("Önce bir waffle seç.");

return;

}

const key =
tur + "_" + isim;


if(!waffle.extralar[key]){

waffle.extralar[key] = {

tur:tur,

isim:isim,

adet:0,

fiyat:ekstraFiyat

};

}


waffle.extralar[key].adet +=
degisiklik;


if(waffle.extralar[key].adet < 0){

waffle.extralar[key].adet = 0;

}


urunleriGoster();

sepetiGoster();

}


/* WAFFLE HTML */

function waffleHTML(item){

const adet =
waffleSiparisleri.filter(
w => w.id === item.id
).length;


let html = "";


/*
Bu waffle çeşidinden sepette bulunan
her instance için ekstra butonu gösteriyoruz.
*/

const instances =
waffleSiparisleri.filter(
w => w.id === item.id
);


if(instances.length === 0){

return `

<div class="product">

<div class="product-info">

<div class="product-name">
${item.isim}
</div>

<div class="product-price">
${item.fiyat} TL
</div>

</div>

<div class="controls">

<button onclick="waffleDegistir('${item.id}',-1)">
−
</button>

<div class="count">
0
</div>

<button onclick="waffleDegistir('${item.id}',1)">
+
</button>

</div>

</div>

`;

}


instances.forEach(w => {

const aktif =
seciliWaffle === w.siparisId;


html += `

<div class="product">

<div class="product-info">

<div class="product-name">
${w.isim} #${w.no}
</div>

<div class="product-price">
${w.fiyat} TL
</div>

<div class="extra-info">
${
Object.values(w.extralar)
.filter(e => e.adet > 0)
.map(e => e.isim + " x" + e.adet)
.join(", ")
|| "Ekstra seçilmedi"
}
</div>

</div>

<button
class="extra-btn ${aktif ? "active" : ""}"
onclick="waffleHedefSec('${w.siparisId}')">

${aktif ? "✓ Seçildi" : "🎯 Ekstra Ekle"}

</button>

</div>

`;

});


return html;

}


/* İÇECEK HTML */

function icecekHTML(item){

const adet =
icecekAdetleri[item.id] || 0;


return `

<div class="product">

<div class="product-info">

<div class="product-name">
${item.isim}
</div>

<div class="product-price">
${item.fiyat} TL
</div>

</div>

<div class="controls">

<button onclick="icecekDegistir('${item.id}',-1)">
−
</button>

<div class="count">
${adet}
</div>

<button onclick="icecekDegistir('${item.id}',1)">
+
</button>

</div>

</div>

`;

}


/* EKSTRA HTML */

function ekstraHTML(liste,tur){

return liste.map(isim => {

let toplamAdet = 0;


waffleSiparisleri.forEach(waffle => {

const key =
tur + "_" + isim;

if(waffle.extralar[key]){

toplamAdet +=
waffle.extralar[key].adet;

}

});


return `

<div class="product">

<div class="product-info">

<div class="product-name">
${isim}
</div>

<div class="product-price">
${ekstraFiyat} TL
</div>

</div>

<div class="controls">

<button
onclick="ekstraDegistir('${tur}','${isim}',-1)">
−
</button>

<div class="count">
${toplamAdet}
</div>

<button
onclick="ekstraDegistir('${tur}','${isim}',1)">
+
</button>

</div>

</div>

`;

}).join("");

}


/* EKRANI GÜNCELLE */

function urunleriGoster(){

document.getElementById("waffleList").innerHTML =
waffleler
.map(w => waffleHTML(w))
.join("");


document.getElementById("icecekList").innerHTML =
icecekler
.map(i => icecekHTML(i))
.join("");


document.getElementById("meyveList").innerHTML =
ekstraHTML(meyveler,"meyve");


document.getElementById("sosList").innerHTML =
ekstraHTML(soslar,"sos");


document.getElementById("suslemeList").innerHTML =
ekstraHTML(suslemeler,"susleme");

}


/* SEPET */

function sepetiGoster(){

const sepet =
document.getElementById("sepetList");

let toplam = 0;

let html = "";


waffleSiparisleri.forEach(waffle => {

toplam += waffle.fiyat;


html += `

<div class="cart-item">

<strong>
🧇 ${waffle.isim} #${waffle.no}
</strong>

— ${waffle.fiyat} TL

`;


Object.values(waffle.extralar)
.forEach(extra => {

if(extra.adet > 0){

const extraToplam =
extra.adet * extra.fiyat;

toplam += extraToplam;


html += `

<div class="cart-extra">

↳ ${extra.isim}
x${extra.adet}
— ${extraToplam} TL

</div>

`;

}

});


html += `</div>`;

});


icecekler.forEach(icecek => {

const adet =
icecekAdetleri[icecek.id] || 0;


if(adet > 0){

const araToplam =
adet * icecek.fiyat;

toplam += araToplam;


html += `

<div class="cart-item">

<strong>
🥤 ${icecek.isim}
</strong>

x${adet}
— ${araToplam} TL

</div>

`;

}

});


if(!html){

html =
`<div class="empty">
Henüz ürün eklenmedi.
</div>`;

}


sepet.innerHTML = html;


document.getElementById("toplam")
.textContent = toplam;


whatsappHazirla();

}


/* WHATSAPP */

let mesaj =
"Merhaba, Şeker Krizi Waffle'dan sipariş vermek istiyorum.%0A%0A";

if(extra.adet > 0){

"   ↳ " +
extra.isim +

extra.adet +
" - " +
araToplam +
" TL%0A";

icecekler.forEach(icecek => {

icecekAdetleri[icecek.id] || 0;


if(adet > 0){

const araToplam =
adet * icecek.fiyat;


mesaj +=
"🥤 " +
icecek.isim +
" x" +
adet +
" - " +
araToplam +
" TL%0A";


toplam += araToplam;

}

mesaj +=
"%0A💰 Toplam: " +
toplam +

document.getElementById("whatsappBtn").href =

}


/* BAŞLANGIÇ */

urunleriGoster();

sepetiGoster();

</script>
