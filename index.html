}

.section-title{

.waffle-name{

.price{

}

.description{

.ingredients-title{

.ingredients{

.ingredient{

.card-buttons{

.card-buttons button{

.add-btn{

}

.edit-btn{
    background:#f1ebe6;

}

.extra-main-btn{

    border:1px solid #ffd0a3;
    border-radius:10px;
    background:#fff3df;
    color:#e85a00;

    font-size:13px;
    font-weight:900;

.extra-price{

.drinks-toggle.open .drinks-arrow{

.drinks-list{

.cart-count{

.cart-total{

/* MODAL */

.modal-bg{

.modal-bg.active{

.modal{

.modal-title{

}

.close-modal{

    height:35px;
    border:0;
    border-radius:50%;
    background:#eee;
    font-size:20px;
}

/* SEPET */

.cart-items{

    flex-direction:column;
    gap:10px;
}

.cart-item{

.cart-item-top{

.cart-item-name{

.cart-item-price{

.cart-item-bottom{

.quantity-controls{

.remove-cart{

    font-size:11px;

.empty-cart{

.cart-actions{

.whatsapp-btn{

.clear-btn{

.edit-ingredient{

footer{

@media(min-width:700px){

    }

    }

    }

    .modal{
        border-radius:20px;
        max-height:85vh;
    }
}
</style>

        icerikler:[

const ekstralar = {

    meyveler:[

    ]

const EKSTRA_FIYATI = 30;


/* =====================================================
   İÇECEKLER
===================================================== */

const icecekler = [

    {isim:"Coca-Cola",fiyat:75},
    {isim:"Fanta",fiyat:75},

    {isim:"Sade Soda",fiyat:40},
    {isim:"Su",fiyat:20}

];


/* =====================================================
   SEPET
===================================================== */

let sepet = [];


/*
   Ekstra seçimleri sadece henüz
   sepete eklenmemiş olan ürün için tutulur.

   Örnek:
   {
      "waffle1|meyveler|Muz":1,
      "waffle1|suslemeler|Renkli Bonibon":1
   }
*/

let ekstraSecimleri = {};


/* =====================================================
   YARDIMCI
===================================================== */

function ekstraKey(urunId,tur,isim){

    return urunId + "|" + tur + "|" + isim;

}


function getExtraCount(urunId,tur,isim){

    const key =
        ekstraKey(
            urunId,
            tur,
            isim
        );

    return ekstraSecimleri[key] || 0;

}


/* =====================================================
   LOCAL STORAGE İÇERİK
===================================================== */

function localKey(id){

    return "icerik_" + id;

}


function icerikleriGetir(urun){

    const kayıt =
        localStorage.getItem(
            localKey(urun.id)
        );

    if(kayıt){

        try{
            return JSON.parse(kayıt);
        }catch(e){}

    }

    return [...urun.icerikler];

}


/* =====================================================
   WAFFLELARI OLUŞTUR
===================================================== */

function waffleleriGoster(){

    const container =
        document.getElementById(
            "waffleContainer"
        );

    container.innerHTML = "";

    waffleler.forEach(urun => {

        const card =
            document.createElement("div");

        card.className =
            "waffle-card";

        const icerikler =
            icerikleriGetir(urun);

        card.innerHTML = `

            <div class="waffle-top">

                <div class="waffle-name">
                    ${urun.isim}
                </div>

                <div class="price">
                    ${urun.fiyat} TL
                </div>

            </div>

            <div class="description">
                ${urun.aciklama}
            </div>

            <div class="ingredients-title">
                İçindekiler:
            </div>

            <div class="ingredients">

                ${
                    icerikler.map(
                        x =>
                        `<span class="ingredient">${x}</span>`
                    ).join("")
                }

            </div>

            <div class="card-buttons">

                <button
                    type="button"
                    class="add-btn"
                    onclick="sepeteEkle('${urun.id}')">

                    🛒 Sepete Ekle

                </button>

                <button
                    type="button"
                    class="edit-btn"
                    onclick="icerigiDuzenle('${urun.id}')">

                    ✏️ İçeriği Düzenle

                </button>

            </div>

            <button
                type="button"
                class="extra-main-btn"
                onclick="ekstraPanelAcKapat('${urun.id}')">

                ➕ Ekstra Ekle

            </button>

            <div
                id="extra-${urun.id}"
                class="extra-panel">

                ${extraHTML(urun)}

            </div>
        `;

        container.appendChild(card);

    });

}
/* =====================================================
   EXTRA PANEL AÇ / KAPAT
===================================================== */

function ekstraPanelAcKapat(urunId){

    const panel =
        document.getElementById(
            "extra-" + urunId
        );

    if(!panel){
        return;
    }

    const button =
        panel.previousElementSibling;

    if(
        panel.classList.contains("active")
    ){

        panel.classList.remove("active");

        if(button){
            button.textContent =
                "➕ Ekstra Ekle";
        }

    }else{

        panel.classList.add("active");

        if(button){
            button.textContent =
                "➖ Ekstraları Kapat";
        }

    }

}

/* =====================================================
   EXTRA HTML
===================================================== */

function extraHTML(urun){

    let html = `

        <div class="extra-title">
            Ekstralarını seç — Her biri +30 TL
        </div>

    `;

    const kategoriler = [

        ["Meyveler","meyveler"],
        ["Soslar","soslar"],
        ["Süslemeler","suslemeler"]

    ];

    kategoriler.forEach(
        ([baslik,tur]) => {

            html += `

                <div class="extra-category">

                    <div class="extra-category-title">
                        ${baslik}
                    </div>

                    <div class="extra-list">

            `;

            ekstralar[tur].forEach(
                isim => {

                    const adet =
                        getExtraCount(
                            urun.id,
                            tur,
                            isim
                        );

                    html += `

                        <div class="extra-item">

                            <div class="extra-info">

                                <span class="extra-name">
                                    ${isim}
                                </span>

                                <span class="extra-price">
                                    +${EKSTRA_FIYATI} TL
                                </span>

                            </div>

                            <div class="extra-actions">

                                <button
                                    type="button"
                                    class="extra-minus"
                                    onclick="ekstraAzalt('${urun.id}','${tur}','${isim}')">

                                    −

                                </button>

                                <span
                                    id="${extraElementId(urun.id,tur,isim)}"
                                    class="extra-count">

                                    ${adet}

                                </span>

                                <button
                                    type="button"
                                    class="extra-plus"
                                    onclick="ekstraArttir('${urun.id}','${tur}','${isim}')">

                                    +

                                </button>

                            </div>

                        </div>

                    `;

                }
            );

            html += `

                    </div>

                </div>

            `;

        }
    );

    html += `

        <div
            id="live-extra-${urun.id}"
            class="extra-live-total">

            Waffle: ${urun.fiyat} TL

        </div>

    `;

    return html;

}


/* =====================================================
   EXTRA ELEMENT ID
===================================================== */

function extraElementId(
    urunId,
    tur,
    isim
){

    return "extra_" +
        urunId +
        "_" +
        tur +
        "_" +
        isim
        .replace(/\s+/g,"_")
        .replace(/[^a-zA-Z0-9ğüşöçıİĞÜŞÖÇ_]/g,"");

}


/* =====================================================
   EXTRA ARTIR
===================================================== */

function ekstraArttir(
    urunId,
    tur,
    isim
){

    const key =
        ekstraKey(
            urunId,
            tur,
            isim
        );

    ekstraSecimleri[key] =
        (ekstraSecimleri[key] || 0) + 1;

    ekstraUIguncelle(
        urunId,
        tur,
        isim
    );

}


/* =====================================================
   EXTRA AZALT
===================================================== */

function ekstraAzalt(
    urunId,
    tur,
    isim
){

    const key =
        ekstraKey(
            urunId,
            tur,
            isim
        );

    if(!ekstraSecimleri[key]){
        return;
    }

    ekstraSecimleri[key]--;

    if(
        ekstraSecimleri[key] <= 0
    ){
        delete ekstraSecimleri[key];
    }

    ekstraUIguncelle(
        urunId,
        tur,
        isim
    );

}


/* =====================================================
   EXTRA UI
===================================================== */

function ekstraUIguncelle(
    urunId,
    tur,
    isim
){

    const element =
        document.getElementById(
            extraElementId(
                urunId,
                tur,
                isim
            )
        );

    if(element){

        element.textContent =
            getExtraCount(
                urunId,
                tur,
                isim
            );

    }

    anlikExtraFiyatGoster(
        urunId
    );

}


/* =====================================================
   SEÇİLİ EKSTRALARI AL
===================================================== */

function seciliEkstralariAl(
    urunId
){

    const sonuc = [];

    Object.keys(
        ekstraSecimleri
    ).forEach(key => {

        const parcalar =
            key.split("|");

        if(
            parcalar[0] !== urunId
        ){
            return;
        }

        const tur =
            parcalar[1];

        const isim =
            parcalar
            .slice(2)
            .join("|");

        const adet =
            ekstraSecimleri[key];

        if(adet > 0){

            sonuc.push({

                tur:tur,

                isim:isim,

                adet:adet,

                fiyat:
                    adet *
                    EKSTRA_FIYATI

            });

        }

    });

    return sonuc;

}


/* =====================================================
   EXTRA TOPLAMI
===================================================== */

function extraToplamHesapla(
    urunId
){

    const secilenler =
        seciliEkstralariAl(
            urunId
        );

    return secilenler.reduce(
        (toplam,extra) =>
            toplam + extra.fiyat,
        0
    );

}


/* =====================================================
   ANLIK FİYAT
===================================================== */

function anlikExtraFiyatGoster(
    urunId
){

    const urun =
        waffleler.find(
            x => x.id === urunId
        );

    if(!urun){
        return;
    }

    const extraToplam =
        extraToplamHesapla(
            urunId
        );

    const toplam =
        urun.fiyat +
        extraToplam;

    const live =
        document.getElementById(
            "live-extra-" + urunId
        );

    if(live){

        if(extraToplam > 0){

            live.textContent =
                `Waffle: ${urun.fiyat} TL + Ekstra: ${extraToplam} TL = ${toplam} TL`;

        }else{

            live.textContent =
                `Waffle: ${urun.fiyat} TL`;

        }

    }

    /*
       ÖNEMLİ:
       Kullanıcı ekstra seçtiğinde alttaki
       sepet fiyatını da anında değiştiriyoruz.
    */

    anlikSepetToplamiGuncelle();

}


/* =====================================================
   ANLIK SEPET TOPLAMI
===================================================== */

function anlikSepetToplamiGuncelle(){

    /*
       Önce gerçekten sepette olanların toplamı.
    */

    let toplam = sepetToplami();


    /*
       Henüz sepete eklenmemiş ürünlerin
       seçili ekstralarını bul.
    */

    const urunler = {};

    Object.keys(
        ekstraSecimleri
    ).forEach(key => {

        const urunId =
            key.split("|")[0];

        urunler[urunId] = true;

    });


    /*
       Ekstraları hesaba kat.
    */

    Object.keys(urunler).forEach(
        urunId => {

            const urun =
                waffleler.find(
                    x => x.id === urunId
                );

            if(!urun){
                return;
            }


            const extraToplam =
                extraToplamHesapla(
                    urunId
                );


            /*
               Ürün zaten sepette mi?
            */

            const sepettekiUrun =
                sepet.find(
                    item =>
                        item.tip === "waffle" &&
                        item.id === urunId
                );


            /*
               Ürün sepette DEĞİLSE:
               waffle fiyatı + ekstra fiyatı ekle.
            */

            if(!sepettekiUrun){

                if(extraToplam > 0){

                    toplam +=
                        urun.fiyat +
                        extraToplam;

                }

            }
            /*
               Ürün zaten sepetteyse:
               Sadece ekstranın fiyatını ekle.
            */

            else{

                toplam +=
                    extraToplam *
                    sepettekiUrun.adet;

            }

        }
    );


    /*
       Alttaki sepet toplamını güncelle.
    */

    const cartTotal =
        document.getElementById(
            "cartTotal"
        );

    if(cartTotal){

        cartTotal.textContent =
            toplam + " TL";

    }

}

/* =====================================================
   SEPETE EKLE
===================================================== */

function sepeteEkle(
    urunId
){

    console.log(
        "Sepete ekleniyor:",
        urunId
    );

    const urun =
        waffleler.find(
            x => x.id === urunId
        );

    if(!urun){

        console.error(
            "Ürün bulunamadı:",
            urunId
        );

        return;

    }

    /*
       O anda seçilmiş ekstraları al.
    */

    const ekstralarSecili =
        seciliEkstralariAl(
            urunId
        );

    const extraToplam =
        extraToplamHesapla(
            urunId
        );

    /*
       Aynı waffle + aynı ekstra kombinasyonu
       varsa adedini artır.
    */

    const mevcut =
        sepet.find(
            item => {

                if(
                    item.tip !== "waffle"
                ){
                    return false;
                }

                if(
                    item.id !== urunId
                ){
                    return false;
                }

                return JSON.stringify(
                    item.ekstralar || []
                ) === JSON.stringify(
                    ekstralarSecili
                );

            }
        );


    if(mevcut){

        mevcut.adet++;

    }else{

        sepet.push({

            tip:"waffle",

            id:urun.id,

            isim:urun.isim,

            fiyat:urun.fiyat,

            ekstralar:
                JSON.parse(
                    JSON.stringify(
                        ekstralarSecili
                    )
                ),

            ekstraToplam:
                extraToplam,

            adet:1

        });

    }


    /*
       Ürünü sepete ekledikten sonra
       o ürünün ekstra seçimlerini temizle.
    */

    Object.keys(
        ekstraSecimleri
    ).forEach(key => {

        if(
            key.startsWith(
                urunId + "|"
            )
        ){

            delete ekstraSecimleri[key];

        }

    });


    /*
       Ekrandaki sayaçları sıfırla.
    */

    extraSayaçlariniSifirla(
        urunId
    );


    /*
       Sepeti güncelle.
    */

    sepetGuncelle();


    /*
       İSTENEN:
       Sepete Ekle'ye basınca modal açılmıyor.
    */

}


/* =====================================================
   EXTRA SAYAÇLARINI SIFIRLA
===================================================== */

function extraSayaçlariniSifirla(
    urunId
){

    const kategoriler = [
        ["meyveler",ekstralar.meyveler],
        ["soslar",ekstralar.soslar],
        ["suslemeler",ekstralar.suslemeler]
    ];

    kategoriler.forEach(
        ([tur,liste]) => {

            liste.forEach(
                isim => {

                    const element =
                        document.getElementById(
                            extraElementId(
                                urunId,
                                tur,
                                isim
                            )
                        );

                    if(element){
                        element.textContent = "0";
                    }

                }
            );

        }
    );

    const urun =
        waffleler.find(
            x => x.id === urunId
        );

    const live =
        document.getElementById(
            "live-extra-" + urunId
        );

    if(
        live &&
        urun
    ){

        live.textContent =
            `Waffle: ${urun.fiyat} TL`;

    }

}


/* =====================================================
   GERÇEK SEPET TOPLAMI
===================================================== */

function sepetToplami(){

    return sepet.reduce(
        (toplam,item) => {

            if(
                item.tip === "waffle"
            ){

                return toplam +
                    (
                        item.fiyat +
                        (item.ekstraToplam || 0)
                    ) *
                    item.adet;

            }

            return toplam +
                item.fiyat *
                item.adet;

        },
        0
    );

}


/* =====================================================
   SEPET GÜNCELLE
===================================================== */

function sepetGuncelle(){

    let adet = 0;

    sepet.forEach(
        item => {

            adet += item.adet;

        }
    );

    document.getElementById(
        "cartCount"
    ).textContent = adet;

    document.getElementById(
        "cartTotal"
    ).textContent =
        sepetToplami() + " TL";

    sepetiRenderla();

}


/* =====================================================
   SEPET RENDER
===================================================== */

function sepetiRenderla(){

    const container =
        document.getElementById(
            "cartItems"
        );

    if(
        sepet.length === 0
    ){

        container.innerHTML = `

            <div class="empty-cart">
                🛒 Sepetiniz boş.
            </div>

        `;

        return;

    }

    container.innerHTML = "";

    sepet.forEach(
        (item,index) => {

            let birimFiyat =
                item.fiyat;

            if(
                item.tip === "waffle"
            ){

                birimFiyat +=
                    item.ekstraToplam || 0;

            }

            const toplam =
                birimFiyat *
                item.adet;


            let extraHTML = "";


            if(
                item.tip === "waffle" &&
                item.ekstralar &&
                item.ekstralar.length > 0
            ){

                const extraNames =
                    item.ekstralar.map(
                        extra => {

                            if(
                                extra.adet > 1
                            ){

                                return `${extra.isim} x${extra.adet}`;

                            }

                            return extra.isim;

                        }
                    );


                extraHTML = `

                    <div class="cart-extra">

                        <strong>
                            Ekstralar:
                        </strong>

                        ${extraNames.join(", ")}

                    </div>

                `;

            }


            const div =
                document.createElement(
                    "div"
                );

            div.className =
                "cart-item";


            div.innerHTML = `

                <div class="cart-item-top">

                    <div class="cart-item-name">
                        ${item.isim}
                    </div>

                    <div class="cart-item-price">
                        ${toplam} TL
                    </div>

                </div>

                ${extraHTML}

                <div class="cart-item-bottom">

                    <div class="quantity-controls">

                        <button
                            type="button"
                            onclick="adetAzalt(${index})">
                            −
                        </button>

                        <strong>
                            ${item.adet}
                        </strong>

                        <button
                            type="button"
                            onclick="adetArttir(${index})">
                            +
                        </button>

                    </div>

                    <button
                        type="button"
                        class="remove-cart"
                        onclick="sepettenSil(${index})">

                        Sil

                    </button>

                </div>

            `;

            container.appendChild(div);

        }
    );

}


/* =====================================================
   ADET ARTIR
===================================================== */

function adetArttir(index){

    if(!sepet[index]){
        return;
    }

    sepet[index].adet++;

    sepetGuncelle();

}


/* =====================================================
   ADET AZALT
===================================================== */

function adetAzalt(index){

    if(!sepet[index]){
        return;
    }

    sepet[index].adet--;

    if(
        sepet[index].adet <= 0
    ){

        sepet.splice(
            index,
            1
        );

    }

    sepetGuncelle();

}


/* =====================================================
   SEPETTEN SİL
===================================================== */

function sepettenSil(index){

    if(!sepet[index]){
        return;
    }

    sepet.splice(
        index,
        1
    );

    sepetGuncelle();

}


/* =====================================================
   SEPETİ TEMİZLE
===================================================== */

function sepetiTemizle(){

    if(
        sepet.length === 0
    ){
        return;
    }

    if(
        !confirm(
            "Sepeti tamamen temizlemek istediğinize emin misiniz?"
        )
    ){
        return;
    }

    sepet = [];

    sepetGuncelle();

}


/* =====================================================
   SEPETİ AÇ
===================================================== */

function sepetiAc(){

    sepetiRenderla();

    document.getElementById(
        "cartModal"
    ).classList.add("active");

}


/* =====================================================
   MODAL KAPAT
===================================================== */

function modalKapat(id){

    const modal =
        document.getElementById(id);

    if(modal){

        modal.classList.remove(
            "active"
        );

    }

}


/* =====================================================
   MODAL DIŞI
===================================================== */

function modalDisinaTikla(
    event,
    id
){

    if(
        event.target.id === id
    ){

        modalKapat(id);

    }

}


/* =====================================================
   İÇERİK DÜZENLE
===================================================== */

function icerigiDuzenle(
    urunId
){

    const urun =
        waffleler.find(
            x => x.id === urunId
        );

    if(!urun){
        return;
    }

    document.getElementById(
        "editModalTitle"
    ).textContent =
        urun.isim +
        " - İçeriği Düzenle";


    const container =
        document.getElementById(
            "editIngredients"
        );

    const icerikler =
        icerikleriGetir(urun);

    container.innerHTML = "";


    icerikler.forEach(
        (isim,index) => {

            const div =
                document.createElement(
                    "div"
                );

            div.className =
                "edit-ingredient";


            div.innerHTML = `

                <span>
                    ${isim}
                </span>

                <button
                    type="button"
                    class="remove-ingredient"
                    onclick="icerikSil('${urunId}',${index})">

                    Çıkar

                </button>

            `;

            container.appendChild(div);

        }
    );


    document.getElementById(
        "editModal"
    ).classList.add("active");

}


/* =====================================================
   İÇERİK SİL
===================================================== */

function icerikSil(
    urunId,
    index
){

    const urun =
        waffleler.find(
            x => x.id === urunId
        );

    if(!urun){
        return;
    }

    const icerikler =
        icerikleriGetir(urun);

    icerikler.splice(
        index,
        1
    );

    localStorage.setItem(
        localKey(urunId),
        JSON.stringify(
            icerikler
        )
    );

    waffleleriGoster();

    icerigiDuzenle(
        urunId
    );

}


/* =====================================================
   İÇECEKLER
===================================================== */

function icecekleriGoster(){

    const container =
        document.getElementById(
            "drinksList"
        );

    container.innerHTML = "";

    icecekler.forEach(
        (icecek,index) => {

            const div =
                document.createElement(
                    "div"
                );

            div.className =
                "drink-card";


            div.innerHTML = `

                <div>

                    <div class="drink-name">
                        ${icecek.isim}
                    </div>

                    <div class="drink-price">
                        ${icecek.fiyat} TL
                    </div>

                </div>

                <button
                    type="button"
                    class="drink-add"
                    onclick="icecekSepeteEkle(${index})">

                    + Sepete

                </button>

            `;

            container.appendChild(div);

        }
    );

}


/* =====================================================
   İÇECEK SEPETE
===================================================== */

function icecekSepeteEkle(index){

    const icecek =
        icecekler[index];

    if(!icecek){
        return;
    }

    const mevcut =
        sepet.find(
            item =>
                item.tip === "icecek" &&
                item.id === "icecek-" + index
        );


    if(mevcut){

        mevcut.adet++;

    }else{

        sepet.push({

            tip:"icecek",

            id:"icecek-" + index,

            isim:icecek.isim,

            fiyat:icecek.fiyat,

            adet:1

        });

    }

    sepetGuncelle();

}


/* =====================================================
   İÇECEKLERİ AÇ/KAPAT
===================================================== */

function icecekleriAcKapat(){

    const list =
        document.getElementById(
            "drinksList"
        );

    const button =
        document.querySelector(
            ".drinks-toggle"
        );

    list.classList.toggle(
        "active"
    );

    button.classList.toggle(
        "open"
    );

}


/* =====================================================
   WHATSAPP
===================================================== */

function whatsappSiparis(){

    if(
        sepet.length === 0
    ){

        alert(
            "Önce sepetinize ürün ekleyin."
        );

        return;

    }


    let mesaj =
        "🧇 *ŞEKER KRİZİ WAFFLE SİPARİŞİ*%0A%0A";


    sepet.forEach(
        (item,index) => {

            let birimFiyat =
                item.fiyat;

            if(
                item.tip === "waffle"
            ){

                birimFiyat +=
                    item.ekstraToplam || 0;

            }


            const toplam =
                birimFiyat *
                item.adet;


            mesaj +=

                            return extra.isim;

                        }
                    )

            mesaj +=
                "%0A";

        }
    );

    );

}

waffleleriGoster();

icecekleriGoster();

sepetGuncelle();
