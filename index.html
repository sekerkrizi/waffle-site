<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Şeker Krizi Waffle</title>
<meta name="description" content="Şeker Krizi Waffle - Taptaze waffle, meyve, sos ve süsleme seçenekleri.">
<link rel="canonical" href="https://sekerkrizi.github.io/waffle-site/">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#f6f1ec;color:#2d1b12;padding-bottom:90px}
body.lock{overflow:hidden}
button{font-family:inherit;cursor:pointer;border:0}
.top{background:linear-gradient(135deg,#ff7b00,#ff4d00);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 14px 12px}
.wrap{max-width:600px;margin:auto}
.logo{font-size:21px;font-weight:900}
.sub{font-size:12px;opacity:.95;margin:2px 0 10px}
.links{display:flex;gap:7px}
.links a{flex:1;color:#fff;text-decoration:none;text-align:center;background:rgba(255,255,255,.2);border-radius:10px;padding:8px 4px;font-size:12px;font-weight:700}
.sticky{position:sticky;top:0;z-index:50;background:#f6f1ec;padding:10px 14px 6px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.search{width:100%;border:1px solid #e6d9cc;border-radius:12px;padding:11px 14px;font-size:15px;background:#fff;outline:none}
.list{padding:8px 14px}
.item{display:flex;gap:12px;background:#fff;border-radius:14px;padding:10px;margin-bottom:10px;box-shadow:0 2px 8px rgba(0,0,0,.05);cursor:pointer}
.info{flex:1;min-width:0;display:flex;flex-direction:column}
.name{font-size:15px;font-weight:800;line-height:1.25}
.desc{font-size:12px;color:#7a655a;line-height:1.4;margin:4px 0 6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.price{margin-top:auto;font-size:15px;font-weight:900;color:#ff5500}
.thumb{position:relative;flex:none;width:106px;height:106px;border-radius:12px;overflow:hidden;background:#fde9c8}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:38px}
.add{position:absolute;right:6px;bottom:6px;width:30px;height:30px;border-radius:50%;background:#fff;color:#ff5500;font-size:20px;font-weight:900;box-shadow:0 2px 6px rgba(0,0,0,.25);line-height:30px}
.empty{text-align:center;color:#999;padding:40px 10px;font-size:14px}
footer{text-align:center;color:#806d62;font-size:12px;padding:20px}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:60;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:rgba(255,255,255,.97);box-shadow:0 -3px 16px rgba(0,0,0,.14);transform:translateY(110%);transition:transform .25s}
.bar.show{transform:none}
.cbtn{width:100%;max-width:600px;margin:auto;display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-radius:14px;background:linear-gradient(135deg,#ff7200,#ff4d00);color:#fff;font-weight:900;font-size:15px}
.cnt{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:24px;border-radius:50%;background:#fff;color:#ff5500;font-size:12px;margin-right:8px}
.bg{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center}
.bg.on{display:flex}
.sheet{width:100%;max-width:600px;max-height:92vh;background:#fff;border-radius:20px 20px 0 0;display:flex;flex-direction:column;overflow:hidden;animation:up .25s}
@keyframes up{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}
.sbody{overflow-y:auto;flex:1;padding-bottom:10px}
.hero{position:relative;height:210px;background:#fde9c8}
.hero img{width:100%;height:100%;object-fit:cover}
.hero .ph{font-size:70px}
.x{position:absolute;top:10px;right:10px;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.95);font-size:22px;color:#444;box-shadow:0 2px 6px rgba(0,0,0,.2);z-index:2}
.pad{padding:14px 16px}
.h1{font-size:19px;font-weight:900}
.sec{font-size:12px;font-weight:900;color:#8a4a21;text-transform:uppercase;letter-spacing:.5px;margin:16px 0 8px}
.ex{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid #f3ece5}
.exn{font-size:14px;font-weight:700}
.exf{font-size:12px;color:#999}
.rd{width:20px;height:20px;border-radius:50%;border:2px solid #ccc;flex:none;margin-left:12px}.rd.on{border-color:#ff5a00;background:radial-gradient(#ff5a00 45%,transparent 50%)}
.qty{display:flex;align-items:center;gap:10px}
.qty button{width:32px;height:32px;border-radius:50%;background:#eee;font-size:18px;font-weight:900;color:#444}
.qty button.p{background:#ff6200;color:#fff}
.qty span{min-width:18px;text-align:center;font-weight:900}
.sfoot{padding:10px 14px calc(12px + env(safe-area-inset-bottom));border-top:1px solid #eee;display:flex;gap:10px;align-items:center;background:#fff}
.sfoot .qty button{width:38px;height:38px}
.go{flex:1;padding:14px;border-radius:12px;background:#ff5a00;color:#fff;font-weight:900;font-size:15px}
.ci{background:#fff8f1;border:1px solid #eedfd2;border-radius:12px;padding:12px;margin-bottom:10px}
.ci .t{display:flex;justify-content:space-between;gap:10px;font-weight:800;font-size:14px}
.ci .t b{color:#ff5500;white-space:nowrap}
.ci .e{font-size:12px;color:#6b5143;margin-top:5px;line-height:1.4}
.ci .b{display:flex;justify-content:space-between;align-items:center;margin-top:9px}
.rm{background:#ffe5e5;color:#d00;border-radius:8px;padding:6px 10px;font-size:12px;font-weight:700}
.inp{width:100%;border:1px solid #e6d9cc;border-radius:10px;padding:11px;font-size:14px;font-family:inherit;margin-top:8px;outline:none}
.tot{display:flex;justify-content:space-between;font-weight:900;font-size:17px;margin:14px 0 4px}
.wa{width:100%;padding:14px;border-radius:12px;background:#25d366;color:#fff;font-weight:900;font-size:15px;margin-top:10px}
.clr{width:100%;padding:11px;border-radius:12px;background:#eee;color:#555;font-weight:700;font-size:13px;margin-top:8px}
.ymrow{display:flex;gap:8px;margin-top:4px}
.ym{flex:1;padding:12px 6px;border-radius:12px;background:#f3ece5;border:2px solid transparent;font-weight:800;font-size:13px;color:#6b5143;line-height:1.3}
.ym.on{background:#fff3e6;border-color:#ff5a00;color:#d94800}
.gelinfo{margin-top:8px;padding:11px;border-radius:10px;background:#eefaf0;color:#2a6b36;font-size:13px;font-weight:600;line-height:1.4}
.blok{background:#fff1f0;border:1px solid #ffc9c4;border-radius:12px;padding:12px;margin-top:8px}
.bt{font-size:13px;color:#a02318;line-height:1.45;font-weight:600}
.gelbig{width:100%;margin-top:10px;padding:15px;border-radius:12px;background:#ff5a00;color:#fff;font-weight:900;font-size:15px}
.tgo{display:block;text-align:center;margin-top:12px;font-size:12px;color:#666;text-decoration:underline}
.tnot{text-align:center;font-size:11px;color:#999;margin-top:3px}
.row{display:flex;justify-content:space-between;font-size:14px;margin-top:8px;color:#5a463b}
.fino{margin-top:8px;padding:9px 10px;border-radius:10px;background:#fff8e6;color:#8a5a00;font-size:12px;font-weight:600;line-height:1.4}
.hata{margin-top:10px;padding:10px;border-radius:10px;background:#ffe5e5;color:#c00;font-size:13px;font-weight:700;line-height:1.4}
.wa.off{background:#b5b5b5}
</style>
</head>
<body>

<div class="top"><div class="wrap">
  <div class="logo">🧇 Şeker Krizi Waffle</div>
  <div class="sub">Tatlı krizinin en lezzetli adresi 🍓🍫</div>
  <div class="links">
    <a href="https://www.instagram.com/sekerkriziwaffle.bv/" target="_blank">📸 Instagram</a>
    <a href="https://maps.app.goo.gl/DyTMhM9Ahvof9vaa7" target="_blank">📍 Yol Tarifi</a>
    <a href="tel:+905358731757">📞 Ara</a>
  </div>
</div></div>

<div class="sticky"><div class="wrap">
  <input id="q" class="search" type="search" placeholder="🔍 Waffle ara..." oninput="draw()">
</div></div>

<div class="wrap list" id="list"></div>
<footer>Şeker Krizi Waffle<br>📞 0535 873 17 57</footer>

<div id="bar" class="bar"><button class="cbtn" onclick="openCart()">
  <span><span id="cnt" class="cnt">0</span>Sepeti Görüntüle</span><span id="tot">0,00 TL</span>
</button></div>

<div id="sbg" class="bg" onclick="if(event.target===this)closeS()"><div class="sheet" id="sheet"></div></div>
<div id="cbg" class="bg" onclick="if(event.target===this)closeC()"><div class="sheet" id="csheet"></div></div>

<script>
/* Fotoğraflar index.html ile aynı yerde durmalı (klasör yok).
   Fotoğrafı olmayan ürünlerde gorsel:"" bırakın, 🧇 simgesi görünür.
   boy = [Standart, Double, XXL] fiyatları. */
const boyutlar=["Standart","Double","XXL (2-3 kişilik)"];
const waffleler=[
{id:"standart",isim:"Standart Karışık Waffle",boy:[225,275,350],aciklama:"Taze muz, çilek, çikolata, beyaz çikolata sos, Bonibon.",gorsel:"standart.jpg"},
{id:"oreolu",isim:"Oreo'lu Waffle",boy:[275,325,400],aciklama:"Özel hazırlanmış bowl waffle hamuru, taze muz dilimi, çilek parçaları, sütlü çikolata ve beyaz çikolata, parçalanmış Oreo bisküvisi.",gorsel:"oreolu.jpg"},
{id:"antep",isim:"Antep Fıstıklı Waffle",boy:[275,325,400],aciklama:"Özel hazırlanmış bowl waffle hamuru, muz, çilek, beyaz çikolata, antep fıstığı sosu, fındık, sütlü damla çikolata.",gorsel:"antep.jpg"},
{id:"orman",isim:"Orman Meyveli Waffle",boy:[275,325,400],aciklama:"Özel hazırlanmış bowl waffle hamuru, orman meyveleri, çilek, sütlü çikolata, beyaz çikolata, frambuaz çikolata, renkli pirinç patlağı.",gorsel:"orman.jpg"},
{id:"lotus",isim:"Lotuslu Waffle",boy:[275,325,400],aciklama:"Özel hazırlanmış bowl waffle hamuru, muz, çilek, sütlü çikolata, beyaz çikolata, lotus sos, lotus bisküvisi.",gorsel:"lotus.jpg"},
{id:"bitter",isim:"Bitter Çikolatalı Waffle",boy:[275,325,400],aciklama:"Özel hazırlanmış bowl waffle hamuru, muz, çilek, sütlü çikolata, bitter çikolata sosu, bitter damla çikolata.",gorsel:"bitter.jpg"},
{id:"kendin",isim:"Kendi Wafflenizi Oluşturun",boy:[179.9],bl:["Standart"],aciklama:"Seçeceğiniz taze meyve, çikolata sosları ve nefis süslemelerle tamamen kendi zevkinize göre tasarlayın.",gorsel:""}
];
/* Ekstra fiyatı (TL): hepsi 30. */
const ekstralar=[
["Ekstra Bonibon",30],["Ekstra Damla Çikolata",30],["Muz",30],["Çilek",30],["Kivi",30],["Orman Meyvesi",30],
["Beyaz Çikolata",30],["Sütlü Çikolata",30],["Ekstra Bitter Çikolata",30],["Ekstra Karamel Çikolata",30],["Ekstra Frambuaz Çikolata",30],
["Sütlü Damla Çikolata",30],["Bitter Damla Çikolata",30],["Ekstra Çakıl Taşı Çikolata",30],
["Oreo Parçacıkları",30],["Ekstra Lotus Parçacıkları",30],["Ekstra Fındık Parçacıkları",30],
["Ekstra Renkli Pirinç Patlağı",30],["Lotus Sosu",30],["Çilek Sosu",30]
];

const TL=n=>(Number.isInteger(n)?String(n):n.toFixed(2).replace('.',','))+' TL';
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
/* TESLİMAT AYARLARI */
const TRENDYOL_LINK=""; /* Trendyol GO mağaza linkinizi tırnakların içine yapıştırın. Boşsa Trendyol butonu görünmez. */
const UCRETSIZ_LIMIT=400,TESLIMAT_UCRETI=35;
const mahalleler=[
{ad:"Zafer",izin:true},{ad:"Soğanlı",izin:true},{ad:"Siyavuşpaşa",izin:true},{ad:"Şirinevler",izin:true},{ad:"Çobançeşme",izin:true},
{ad:"Yenibosna Merkez",izin:true},{ad:"Hürriyet",izin:true},{ad:"Fevzi Çakmak",izin:true},{ad:"Kocasinan Merkez",izin:true},
{ad:"Bahçelievler",izin:false},{ad:"Cumhuriyet",izin:false}
];
let sepet=[],curBoy=0,cur=null,curEx={},curQty=1,not="",ad="",yontem="adres",mah="",adres="",hata="";
try{sepet=JSON.parse(localStorage.getItem("sk_sepet2")||"[]")}catch(e){}
const kaydet=()=>{try{localStorage.setItem("sk_sepet2",JSON.stringify(sepet))}catch(e){}};

function img(u,cls){
  if(!u)return '<div class="ph">🧇</div>';
  return '<img src="'+encodeURI(u)+'" alt="'+esc(cls)+'" loading="lazy" onerror="this.outerHTML=\'<div class=ph>🧇</div>\'">';
}

function draw(){
  const q=document.getElementById("q").value.toLocaleLowerCase("tr").trim();
  const liste=waffleler.filter(w=>!q||(w.isim+" "+w.aciklama).toLocaleLowerCase("tr").includes(q));
  document.getElementById("list").innerHTML=liste.length?liste.map(w=>
    '<div class="item" onclick="openS(\''+w.id+'\')"><div class="info"><div class="name">'+esc(w.isim)+'</div><div class="desc">'+esc(w.aciklama)+'</div><div class="price">'+TL(w.boy[0])+'</div></div><div class="thumb">'+img(w.gorsel,w.isim)+'<button class="add" aria-label="Ekle">+</button></div></div>').join(""):'<div class="empty">Sonuç bulunamadı 🧇</div>';
}

function lock(){document.body.classList.toggle("lock",document.querySelector(".bg.on")!==null)}

function openS(id){
  cur=waffleler.find(w=>w.id===id);curEx={};curQty=1;curBoy=0;
  document.getElementById("sbg").classList.add("on");lock();renderS();
}
function renderS(){
  const BL=cur.bl||boyutlar;
  let bo=BL.map((b,i)=>'<div class="ex" style="cursor:pointer" onclick="setBoy('+i+')"><div class="exn">'+b+'</div><div style="display:flex;align-items:center"><span class="exn" style="color:#ff5500">'+TL(cur.boy[i])+'</span><span class="rd'+(i===curBoy?' on':'')+'"></span></div></div>').join("");
  let ex=ekstralar.map((e,i)=>'<div class="ex"><div><div class="exn">'+e[0]+'</div><div class="exf">'+(e[1]?'+'+TL(e[1]):'Ücretsiz')+'</div></div><div class="qty"><button onclick="exD('+i+',-1)">−</button><span id="ex'+i+'">'+(curEx[i]||0)+'</span><button class="p" onclick="exD('+i+',1)">+</button></div></div>').join("");
  document.getElementById("sheet").innerHTML=
   '<div class="sbody"><div class="hero"><button class="x" onclick="closeS()">×</button>'+img(cur.gorsel,cur.isim)+'</div>'+
   '<div class="pad"><div class="h1">'+esc(cur.isim)+'</div><div class="desc" style="-webkit-line-clamp:unset">'+esc(cur.aciklama)+'</div>'+
   (BL.length>1?'<div class="sec">Boyut Seçin</div>'+bo:'')+'<div class="sec">Ekstralar ve Malzemeler</div>'+ex+'</div></div>'+
   '<div class="sfoot"><div class="qty"><button onclick="qD(-1)">−</button><span id="qn">'+curQty+'</span><button class="p" onclick="qD(1)">+</button></div><button class="go" onclick="addCart()">Sepete Ekle · <span id="sp">'+TL(sPrice())+'</span></button></div>';
}
function exFiyat(){return Object.keys(curEx).reduce((t,i)=>t+ekstralar[i][1]*curEx[i],0)}
function sPrice(){return (cur.boy[curBoy]+exFiyat())*curQty}
function upd(){document.getElementById("sp").textContent=TL(sPrice());document.getElementById("qn").textContent=curQty}
function setBoy(i){curBoy=i;document.querySelectorAll('.rd').forEach((r,j)=>r.classList.toggle('on',j===i));upd()}
function exD(i,d){
  curEx[i]=Math.max(0,(curEx[i]||0)+d);if(!curEx[i])delete curEx[i];
  document.getElementById("ex"+i).textContent=curEx[i]||0;upd();
}
function qD(d){curQty=Math.max(1,curQty+d);upd()}
function closeS(){document.getElementById("sbg").classList.remove("on");lock()}

function addCart(){
  const ex=Object.keys(curEx).map(i=>({isim:ekstralar[i][0],f:ekstralar[i][1],adet:curEx[i]}));
  const imza=cur.id+"|"+curBoy+"|"+ex.map(e=>e.isim+e.adet).sort().join(",");
  const var_=sepet.find(s=>s.imza===imza);
  if(var_)var_.adet+=curQty;
  else sepet.push({imza,id:cur.id,isim:cur.isim,boy:(cur.bl||boyutlar)[curBoy],fiyat:cur.boy[curBoy],ekstralar:ex,adet:curQty});
  kaydet();closeS();upBar();
}

const satir=s=>(s.fiyat+s.ekstralar.reduce((t,e)=>t+e.f*e.adet,0))*s.adet;
const toplam=()=>sepet.reduce((t,s)=>t+satir(s),0);
const adetT=()=>sepet.reduce((t,s)=>t+s.adet,0);

function upBar(){
  document.getElementById("cnt").textContent=adetT();
  document.getElementById("tot").textContent=TL(toplam());
  document.getElementById("bar").classList.toggle("show",sepet.length>0);
  if(!sepet.length)closeC();
}

function openCart(){document.getElementById("cbg").classList.add("on");lock();renderC()}
function closeC(){document.getElementById("cbg").classList.remove("on");lock()}
const mObj=()=>mah===""?null:(mah==="diger"?{ad:"Diğer",izin:false}:mahalleler[+mah]);
const bolgeDisi=()=>yontem==="adres"&&mObj()!==null&&!mObj().izin;
const ucret=()=>(yontem==="gel"||!sepet.length)?0:(toplam()>=UCRETSIZ_LIMIT?0:TESLIMAT_UCRETI);
const genel=()=>toplam()+ucret();
function setY(k){yontem=k;hata="";renderC()}
function setM(v){mah=v;hata="";renderC()}
function renderC(){
  const c=document.getElementById("csheet");
  const old=c.querySelector?c.querySelector('.sbody'):null;const st=old?old.scrollTop:0;
  if(!sepet.length){c.innerHTML='<div class="sbody pad"><div class="empty">Sepetiniz boş 🧇</div></div>';return}
  const items=sepet.map((s,i)=>'<div class="ci"><div class="t"><span>'+esc(s.isim)+(s.boy?'<br><small style="font-weight:600;color:#7a655a">'+s.boy+'</small>':'')+'</span><b>'+TL(satir(s))+'</b></div>'+
    (s.ekstralar.length?'<div class="e"><strong>Ekstralar:</strong> '+s.ekstralar.map(e=>e.adet+'x '+esc(e.isim)).join(", ")+'</div>':'')+
    '<div class="b"><div class="qty"><button onclick="cD('+i+',-1)">−</button><span>'+s.adet+'</span><button class="p" onclick="cD('+i+',1)">+</button></div><button class="rm" onclick="cDel('+i+')">Kaldır</button></div></div>').join("");
  const disi=bolgeDisi();
  const yb=(k,t)=>'<button class="ym'+(yontem===k?' on':'')+'" onclick="setY(\''+k+'\')">'+t+'</button>';
  let h='<div class="sbody pad"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><div class="h1">🛒 Sepetim</div><button class="x" style="position:static" onclick="closeC()">×</button></div>'+items+
   '<div class="sec">Teslimat Yöntemi</div><div class="ymrow">'+yb('adres','🛵 Adrese Teslimat')+yb('gel','🛍️ Gel-Al (Dükkândan Teslim)')+'</div>'+
   '<input id="ad" class="inp" placeholder="Adınız Soyadınız *" value="'+esc(ad)+'" oninput="ad=this.value">';
  if(yontem==="adres"){
    h+='<select id="mah" class="inp" onchange="setM(this.value)"><option value="">Mahalle seçin * (Bahçelievler / İstanbul)</option>'+
      mahalleler.map((x,i)=>'<option value="'+i+'"'+(mah===String(i)?' selected':'')+'>'+x.ad+' Mahallesi</option>').join("")+
      '<option value="diger"'+(mah==="diger"?' selected':'')+'>Diğer (listede yok)</option></select>';
    if(disi){
      h+='<div class="blok"><div class="bt">Üzgünüz, şu anda adresinize kendi paket servisimizle teslimat yapamıyoruz. Dilerseniz siparişinizi Gel-Al olarak oluşturabilirsiniz.</div>'+
        '<button class="gelbig" onclick="setY(\'gel\')">🛍️ Gel-Al Siparişi Oluştur</button>'+
        (TRENDYOL_LINK?'<a class="tgo" href="'+TRENDYOL_LINK+'" target="_blank" rel="noopener">Trendyol GO\'da Kontrol Et</a><div class="tnot">Bölgenize hizmet verilip verilmediğini Trendyol GO\'da kontrol edebilirsiniz.</div>':'')+'</div>';
    }else{
      h+='<textarea id="adres" class="inp" rows="3" placeholder="Açık adres * (sokak, bina no, daire no, tarif)" oninput="adres=this.value">'+esc(adres)+'</textarea>';
    }
  }else{
    h+='<div class="gelinfo">🛍️ Siparişinizi dükkândan teslim alacaksınız. Mahalle ve adres gerekmez.</div>';
  }
  const u=ucret();
  h+='<textarea id="not" class="inp" rows="2" placeholder="Sipariş notu (isteğe bağlı)" oninput="not=this.value">'+esc(not)+'</textarea>'+
   '<div class="row"><span>Ürünlerin toplamı</span><span>'+TL(toplam())+'</span></div>'+
   '<div class="row"><span>Teslimat ücreti</span><span>'+(yontem==="gel"?'Gel-Al · Ücretsiz':(u?TL(u):'Ücretsiz'))+'</span></div>'+
   '<div class="tot"><span>Genel toplam</span><span>'+TL(genel())+'</span></div>';
  if(yontem==="adres"&&!disi){
    h+='<div class="fino">🛵 400 TL ve üzeri siparişlerde ücretsiz teslimat!'+(toplam()<UCRETSIZ_LIMIT?' <b>'+TL(UCRETSIZ_LIMIT-toplam())+'</b> daha ekleyin.':' 🎉 Ücretsiz teslimat kazandınız.')+'</div>';
  }
  h+=(hata?'<div class="hata" id="hata">'+esc(hata)+'</div>':'')+
   '<button class="wa'+(disi?' off':'')+'" onclick="waSiparis()">'+(disi?'Bu bölgeye teslimat yapılamıyor':'💬 WhatsApp\'tan Sipariş Ver')+'</button><button class="clr" onclick="if(confirm(\'Sepet temizlensin mi?\')){sepet=[];kaydet();upBar()}">🗑️ Sepeti Temizle</button></div>';
  c.innerHTML=h;
  const nb=c.querySelector?c.querySelector('.sbody'):null;if(nb)nb.scrollTop=st;
}
function cD(i,d){sepet[i].adet+=d;if(sepet[i].adet<1)sepet.splice(i,1);kaydet();upBar();renderC()}
function cDel(i){sepet.splice(i,1);kaydet();upBar();renderC()}

function hataGoster(t){
  hata=t;renderC();
  const e=document.getElementById("hata");if(e&&e.scrollIntoView)e.scrollIntoView({block:"center"});
}
function waSiparis(){
  if(!sepet.length)return;
  if(!ad.trim())return hataGoster("Lütfen adınızı yazın.");
  if(yontem==="adres"){
    if(mah==="")return hataGoster("Lütfen mahalle seçin.");
    if(bolgeDisi())return hataGoster("Seçtiğiniz mahalleye teslimat yapılamıyor. Gel-Al siparişi oluşturabilirsiniz.");
    if(adres.trim().length<10)return hataGoster("Lütfen açık adresinizi yazın (sokak, bina no, daire no).");
  }
  const u=ucret();
  let m="🛒 *Şeker Krizi Waffle - Yeni Sipariş*\n\n";
  m+="👤 Müşteri: "+ad.trim()+"\n";
  m+="🚚 Teslimat: "+(yontem==="adres"?"Adrese Teslimat":"Gel-Al (Dükkândan Teslim)")+"\n";
  if(yontem==="adres"){
    m+="📍 Mahalle: "+mahalleler[+mah].ad+" Mahallesi, Bahçelievler / İstanbul\n";
    m+="🏠 Adres: "+adres.trim()+"\n";
  }else{
    m+="🏠 Adres: Gel-Al Siparişi\n";
  }
  m+="\n*Ürünler:*\n";
  sepet.forEach(s=>{
    m+="• "+s.adet+"x "+s.isim+(s.boy?" ("+s.boy+")":"")+" - "+TL(satir(s))+"\n";
    if(s.ekstralar.length)m+="   _Ekstralar: "+s.ekstralar.map(e=>e.adet+"x "+e.isim).join(", ")+"_\n";
  });
  if(not.trim())m+="\n📝 Not: "+not.trim()+"\n";
  m+="\nÜrünlerin toplamı: "+TL(toplam());
  m+="\nTeslimat ücreti: "+(yontem==="gel"?"Gel-Al (Ücretsiz)":(u?TL(u):"Ücretsiz"));
  m+="\n*Genel toplam: "+TL(genel())+"*";
  m+="\n\nSiparişiniz işletme tarafından onaylandıktan sonra hazırlanacaktır.";
  window.open("https://wa.me/905358731757?text="+encodeURIComponent(m),"_blank");
}

draw();upBar();
</script>
